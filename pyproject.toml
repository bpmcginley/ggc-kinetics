[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ggc-kinetics"
version = "0.2.0"
description = "Zero-ODE enzyme progress-curve solvers, detectors and a plate-reader parser (frozen from GGC-inf)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "Bruce McGinley"}]
keywords = ["enzyme kinetics", "progress curve", "Michaelis-Menten", "Lambert W", "plate reader"]
dependencies = ["numpy", "scipy"]
classifiers = ["Programming Language :: Python :: 3",
               "Operating System :: OS Independent", "Development Status :: 3 - Alpha",
               "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Chemistry"]

[project.urls]
Homepage = "https://github.com/bpmcginley/ggc-kinetics"
Repository = "https://github.com/bpmcginley/ggc-kinetics"
Issues = "https://github.com/bpmcginley/ggc-kinetics/issues"

[project.optional-dependencies]
app = ["streamlit", "matplotlib"]

[project.scripts]
ggc-fit = "ggc_kinetics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
