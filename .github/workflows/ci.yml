name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: ggc-fit CLI smoke check
        run: |
          ggc-fit tests/data/plate_healthy_biotek_wide.csv --evidence MODELED --scale 0.05 --offset 0.040 --out ci_out
          test -s ci_out/plate_healthy_biotek_wide.report.json
          test -s ci_out/plate_healthy_biotek_wide.report.md
          python examples/quickstart.py
